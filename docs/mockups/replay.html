<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Rep Raiders – Replay decision</title>
<script src="c43be3aa-6773-410b-98d9-379f5da1a7e1"></script>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0;background:#0B0B0D}
a{color:#F2B233}a:hover{color:#FFD173}
.press:active{transform:skewX(-6deg) scale(0.96)!important}
@keyframes flick{0%,100%{opacity:1}50%{opacity:0.8}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes slide{from{background-position:0 0}to{background-position:28.28px 0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; --beat: {{beat}}ms; background: radial-gradient(ellipse 80% 30% at 50% 28%, rgba(200,16,46,0.25), transparent 70%), linear-gradient(180deg, #111114 0%, #1A0D10 100%); color: #F4F1EA; font-family: Inter, sans-serif">

<svg aria-hidden="true" width="390" height="844" sc-camel-view-box="0 0 390 844" style="position: absolute; inset: 0; pointer-events: none">
<defs><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient></defs>
<rect x="110" y="178" width="26" height="7" rx="2" fill="#3A3D45"></rect><polygon points="114,185 132,185 180,316 60,316" fill="url(#beam)" style="animation: flick var(--beat) ease-in-out infinite"></polygon>
<rect x="256" y="178" width="26" height="7" rx="2" fill="#3A3D45"></rect><polygon points="260,185 278,185 330,316 210,316" fill="url(#beam)" style="animation: flick var(--beat) ease-in-out infinite"></polygon>
<rect x="0" y="316" width="390" height="528" fill="#0B0B0D"></rect>
<rect x="0" y="316" width="390" height="3" fill="#C8102E"></rect>
<g transform="translate(118 316)" fill="#C8102E" stroke="#C8102E" stroke-linecap="round"><g style="animation: bob var(--beat) ease-in-out infinite"><path d="M-3 -18 L-8 0 M3 -18 L8 0" fill="none" stroke-width="4"></path><circle cx="0" cy="-46" r="6" stroke="none"></circle><polygon points="-7,-38 7,-38 5,-18 -5,-18" stroke="none"></polygon><path d="M-6 -35 L-14 -26 M6 -35 L18 -40" fill="none" stroke-width="4"></path><path d="M18 -40 L30 -60" fill="none" stroke="#F4F1EA" stroke-width="3"></path></g></g>
<g transform="translate(276 316) scale(1.45)" fill="#3A3D45" stroke="#3A3D45" stroke-linecap="round"><g style="transform-box: fill-box; transform-origin: 50% 100%; animation: breathe calc(var(--beat) * 2) ease-in-out infinite"><path d="M-5 -20 L-9 0 M5 -20 L9 0" fill="none" stroke-width="6"></path><circle cx="0" cy="-50" r="7" stroke="none"></circle><polygon points="-12,-42 12,-42 8,-20 -8,-20" stroke="none"></polygon><path d="M-11 -38 L-18 -22 M11 -38 L18 -22" fill="none" stroke-width="6"></path></g></g>
</svg>

<header style="position: absolute; left: 0; right: 0; top: 0; height: 104px; box-sizing: border-box; padding: 0 16px 12px; display: flex; align-items: flex-end; gap: 12px; background-color: #111114; background-image: repeating-linear-gradient(45deg, rgba(200,16,46,0.15) 0 10px, transparent 10px 20px); animation: slide calc(var(--beat) * 2) linear infinite; border-bottom: 1px solid #3A3D45">
<a href="Main.dc.html" aria-label="Close replay" style="flex: none; width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid #3A3D45; background: #111114; color: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
<h1 style="flex: 1; margin: 0 0 4px; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 32px; line-height: 1; transform: skewX(-6deg)">REPLAY</h1>
<span style="font-family: Teko, sans-serif; font-weight: 600; font-size: 26px; line-height: 1; color: #8A8F99">BATTLE <span style="color: #F4F1EA">9/14</span></span>
</header>

<section style="position: absolute; left: 16px; right: 16px; top: 114px; background: #1E1F24; border: 2px solid #3A3D45; border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 10px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px"><div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em">WARRIOR</span><span style="font-family: Teko, sans-serif; font-weight: 600; font-size: 22px; line-height: 1">62</span></div><div style="height: 8px; border-radius: 2px; background: #2A2C33"><div style="width: 62%; height: 8px; border-radius: 2px; background: #F2B233"></div></div></div>
<span style="font-family: 'Lilita One', sans-serif; font-size: 16px; color: #8A8F99">VS</span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px"><div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: Teko, sans-serif; font-weight: 600; font-size: 22px; line-height: 1">100</span><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em">BRUTE</span></div><div style="height: 8px; border-radius: 2px; background: #2A2C33; display: flex; justify-content: flex-end"><div style="width: 100%; height: 8px; border-radius: 2px; background: #C8102E"></div></div></div>
</section>

<div style="position: absolute; left: 16px; right: 16px; top: 330px; height: 44px; display: flex; align-items: center; gap: 10px">
<button aria-label="Pause replay" style="width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid #3A3D45; background: #111114; color: #F4F1EA; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="14" height="14" sc-camel-view-box="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg></button>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #2A2C33"><div style="width: 58%; height: 6px; border-radius: 3px; background: #C8102E"></div></div>
<span style="font-family: Teko, sans-serif; font-weight: 600; font-size: 22px; line-height: 1; padding-top: 3px">2×</span>
</div>

<section style="position: absolute; left: 16px; right: 16px; top: 386px; background: rgba(30,31,36,0.95); border: 1px solid #F2B233; border-radius: 16px; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="align-self: center; padding: 2px; background: #F2B233; clip-path: polygon(0 0, 100% 0, 92% 50%, 100% 100%, 0 100%, 8% 50%)"><div style="padding: 4px 28px 3px; background: #C8102E; clip-path: polygon(0 0, 100% 0, 92% 50%, 100% 100%, 0 100%, 8% 50%); font-family: 'Lilita One', sans-serif; font-size: 16px; letter-spacing: 0.06em; white-space: nowrap">YOUR CALL</div></div>
<h2 style="margin: 0; text-align: center; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 26px; line-height: 1.05; transform: skewX(-6deg)">A BRUTE BLOCKS THE PATH</h2>
<p style="margin: 0; text-align: center; font-size: 13px; color: #C9CBD1">Your hero holds position until you decide.</p>
<div role="radiogroup" aria-label="Choose a move" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<button role="radio" aria-checked="{{o.checked}}" sc-camel-on-click="{{o.pick}}" style="height: 60px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; text-align: left; font-family: Inter, sans-serif; cursor: pointer; color: #F4F1EA; background: {{o.bg}}; border: {{o.border}}; border-left: 4px solid #C8102E">
<span style="flex: none; width: 36px; height: 36px; border-radius: 8px; background: #111114; display: flex; align-items: center; justify-content: center; color: #F2B233">
<sc-if value="{{o.isStrike}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg></sc-if>
<sc-if value="{{o.isGuard}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg></sc-if>
<sc-if value="{{o.isRetreat}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></sc-if>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-family: 'Lilita One', sans-serif; font-size: 16px; letter-spacing: 0.02em">{{o.title}}</span><span style="font-size: 12px; color: #C9CBD1">{{o.sub}}</span></span>
</button>
</sc-for>
</div>
<div style="margin-top: 2px; padding: 3px; border-radius: 13px; background-image: repeating-linear-gradient(45deg, rgba(200,16,46,0.35) 0 10px, transparent 10px 20px); animation: slide calc(var(--beat) * 2) linear infinite"><a href="Main.dc.html" class="press" style="height: 52px; border-radius: 10px; background: #F2B233; color: #111114; text-decoration: none; font-family: 'Lilita One', sans-serif; font-size: 20px; letter-spacing: 0.05em; transform: skewX(-6deg); display: flex; align-items: center; justify-content: center">LOCK IT IN</a></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;bpm&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:100,&quot;min&quot;:60,&quot;max&quot;:140,&quot;unit&quot;:&quot;BPM&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() {
const bpm = this.props.bpm ?? 100;
const cur = (this.state && this.state.pick) || 'strike';
const list = [
{ id: 'strike', title: 'HEAVY STRIKE', sub: 'Big hit, slow to recover' },
{ id: 'guard', title: 'GUARD', sub: 'Block the first blow, then counter' },
{ id: 'retreat', title: 'RETREAT TO CAMP', sub: 'End the expedition and keep your gold' }
];
return {
beat: Math.round(60000 / bpm),
options: list.map((o) => {
const on = o.id === cur;
return {
title: o.title,
sub: o.sub,
checked: on ? 'true' : 'false',
isStrike: o.id === 'strike',
isGuard: o.id === 'guard',
isRetreat: o.id === 'retreat',
bg: on ? '#7A0C14' : '#16171B',
border: on ? '1.5px solid #F2B233' : '1.5px solid #3A3D45',
pick: () => this.setState({ pick: o.id })
};
})
};
}
}
</script>


</body></html>
