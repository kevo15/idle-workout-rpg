<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Rep Raiders – Workout</title>
<script src="dd8842af-6bd0-440a-8701-d04dc1f57d23"></script>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0;background:#0B0B0D}
a{color:#F2B233}a:hover{color:#FFD173}
.press:active{transform:skewX(-6deg) scale(0.96)!important}
@keyframes flick{0%,100%{opacity:1}50%{opacity:0.8}}
@keyframes hr{from{transform:translateX(0)}to{transform:translateX(-120px)}}
@keyframes puff{0%{opacity:0;transform:translateY(0) scale(0.5)}15%{opacity:0.4}100%{opacity:0;transform:translateY(-16px) scale(1.6)}}
@keyframes slide{from{background-position:0 0}to{background-position:28.28px 0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; --beat: {{beat}}ms; background: radial-gradient(ellipse 80% 40% at 50% 42%, rgba(200,16,46,0.25), transparent 70%), linear-gradient(180deg, #111114 0%, #1A0D10 100%); color: #F4F1EA; font-family: Inter, sans-serif">

<svg aria-hidden="true" width="390" height="844" sc-camel-view-box="0 0 390 844" style="position: absolute; inset: 0; pointer-events: none">
<defs><linearGradient id="beamL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient><linearGradient id="beamR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient></defs>
<rect x="0" y="0" width="34" height="8" rx="2" fill="#3A3D45"></rect><rect x="356" y="0" width="34" height="8" rx="2" fill="#3A3D45"></rect>
<polygon points="6,8 30,8 290,470 110,470" fill="url(#beamL)" style="animation: flick var(--beat) ease-in-out infinite"></polygon>
<polygon points="360,8 384,8 280,470 100,470" fill="url(#beamR)" style="animation: flick var(--beat) ease-in-out infinite"></polygon>
<g transform="translate(0 360)" fill="none" stroke="#FF6A1A" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"><path d="M0 0h40l6-10 6 26 6-40 6 30 6-6h50h40l6-10 6 26 6-40 6 30 6-6h50h40l6-10 6 26 6-40 6 30 6-6h50h40l6-10 6 26 6-40 6 30 6-6h50h40l6-10 6 26 6-40 6 30 6-6h50" style="animation: hr calc(var(--beat) * 2) linear infinite"></path></g>
<rect x="0" y="796" width="390" height="48" fill="#0B0B0D"></rect><rect x="0" y="796" width="390" height="3" fill="#C8102E"></rect>
</svg>

<main style="position: relative; height: 844px; box-sizing: border-box; padding: 50px 20px 0; display: flex; flex-direction: column; align-items: center">

<div style="align-self: stretch; height: 44px; display: flex; align-items: center; justify-content: space-between">
<span style="background: #F4F1EA; color: #111114; font-size: 10px; font-weight: 800; letter-spacing: 0.14em; padding: 4px 9px; border-radius: 2px; transform: rotate(-2deg)">CLASS QUEST</span>
<a href="Quests.dc.html" aria-label="End workout" style="width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid #3A3D45; background: #111114; color: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>

<h1 style="margin: 12px 0 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 48px; line-height: 1; transform: skewX(-6deg)">PUSH-UPS</h1>
<span style="margin-top: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #F2B233">{{coachLine}}</span>

<div style="position: relative; width: 290px; height: 290px; margin-top: 18px">
<svg aria-hidden="true" width="290" height="290" sc-camel-view-box="0 0 290 290" style="position: absolute; inset: 0"><circle cx="145" cy="145" r="142" fill="#1E1F24" stroke="#3A3D45" stroke-width="3"></circle><circle cx="145" cy="145" r="116" fill="none" stroke="#2A2C33" stroke-width="30"></circle><circle cx="145" cy="145" r="116" fill="none" stroke="#F2B233" stroke-width="30" stroke-dasharray="728.8" stroke-dashoffset="182.2" transform="rotate(-90 145 145)"></circle><circle cx="145" cy="145" r="100" fill="#16171B" stroke="#3A3D45" stroke-width="2"></circle><circle cx="145" cy="145" r="131" fill="none" stroke="#3A3D45" stroke-width="1"></circle><text x="145" y="14" text-anchor="middle" font-family="Teko" font-weight="600" font-size="13" fill="#8A8F99" dominant-baseline="middle">20 KG</text><g fill="#F4F1EA"><circle cx="110" cy="262" r="4" style="transform-box: fill-box; transform-origin: center; animation: puff var(--beat) ease-out infinite"></circle><circle cx="145" cy="270" r="3" style="transform-box: fill-box; transform-origin: center; animation: puff var(--beat) ease-out infinite; animation-delay: calc(var(--beat) / -3)"></circle><circle cx="180" cy="262" r="4" style="transform-box: fill-box; transform-origin: center; animation: puff var(--beat) ease-out infinite; animation-delay: calc(var(--beat) / -1.5)"></circle></g></svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-family: Teko, sans-serif; font-weight: 600; font-size: 108px; line-height: 0.8; padding-top: 16px">00:24</span>
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.2em; color: #8A8F99">{{statusLabel}}</span>
</div>
</div>

<div style="align-self: stretch; margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: #1E1F24; border: 2px solid #3A3D45; border-radius: 12px; overflow: hidden"><div style="background: #C8102E; padding: 4px 10px; font-size: 10px; font-weight: 700; letter-spacing: 0.14em">REPS</div><div style="padding: 4px 10px 2px; font-family: Teko, sans-serif; font-weight: 600; font-size: 40px; line-height: 1">6<span style="color: #8A8F99">/10</span></div></div>
<div style="background: #1E1F24; border: 2px solid #3A3D45; border-radius: 12px; overflow: hidden"><div style="background: #C8102E; padding: 4px 10px; font-size: 10px; font-weight: 700; letter-spacing: 0.14em">SET</div><div style="padding: 4px 10px 2px; font-family: Teko, sans-serif; font-weight: 600; font-size: 40px; line-height: 1">2<span style="color: #8A8F99">/3</span></div></div>
</div>

<div style="align-self: stretch; margin-top: 18px; display: flex; gap: 10px">
<button sc-camel-on-click="{{togglePause}}" class="press" style="flex: 1; height: 58px; border: 0; border-radius: 10px; background: #C8102E; color: #F4F1EA; font-family: 'Lilita One', sans-serif; font-size: 19px; letter-spacing: 0.04em; transform: skewX(-6deg); cursor: pointer">{{pauseLabel}}</button>
<div style="flex: 1.3; padding: 3px; border-radius: 12px; background-image: repeating-linear-gradient(45deg, rgba(200,16,46,0.35) 0 10px, transparent 10px 20px); animation: slide calc(var(--beat) * 2) linear infinite"><a href="Quests.dc.html" class="press" style="height: 52px; border-radius: 9px; background: #F2B233; color: #111114; text-decoration: none; font-family: 'Lilita One', sans-serif; font-size: 19px; letter-spacing: 0.04em; transform: skewX(-6deg); display: flex; align-items: center; justify-content: center">SET DONE</a></div>
</div>
<button style="margin-top: 10px; height: 44px; border: 0; background: transparent; color: #C9CBD1; font-family: Inter, sans-serif; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3M20 16H6l3 3"></path></svg>Too tough? Swap to knee push-ups</button>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;bpm&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:50,&quot;min&quot;:30,&quot;max&quot;:120,&quot;unit&quot;:&quot;reps/min&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() {
const bpm = this.props.bpm ?? 50;
const paused = !!(this.state && this.state.paused);
return {
beat: Math.round(60000 / bpm),
pauseLabel: paused ? 'RESUME' : 'PAUSE',
statusLabel: paused ? 'PAUSED' : 'REMAINING',
coachLine: paused ? 'CATCH YOUR BREATH' : 'SET 2 OF 3 · REP IT OUT',
togglePause: () => this.setState({ paused: !paused })
};
}
}
</script>


</body></html>
