svg *{transform-box:view-box}
.hero{animation:bounce .9s ease-in-out infinite}

.dot{animation:dot 1.5s steps(1) infinite;opacity:0}
.d2{animation-delay:.25s}.d3{animation-delay:.5s}
@keyframes dot{0%{opacity:0}20%,80%{opacity:1}100%{opacity:0}}
.sweep{animation:sweep 1.8s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateX(0)}50%{transform:translateX(360px)}}
